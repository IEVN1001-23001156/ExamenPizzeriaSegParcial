<div class="max-w-4xl mx-auto p-6 bg-white rounded-2xl shadow-lg border border-slate-100 mt-6">
  <form [formGroup]="pedidoForm" (ngSubmit)="registrarPedido()" class="space-y-6">
    <div class="flex items-center justify-between pb-4 mb-6 border-b border-slate-100">
      <div>  
       <div>
        <h2 class="text-2xl font-extrabold text-[#D63E12] tracking-tight">Pedidos</h2>
      </div>
        <p class="text-sm text-slate-500 mt-1">Ingresa tus datos y arma tus pizzas</p>
      </div>
    </div>

    <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 mb-6 space-y-4">
      <h3 class="font-bold text-slate-700 text-sm uppercase tracking-wider">Información del Cliente</h3>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Nombre Cliente:</label>
          <input type="text" formControlName="NombreCliente" class="w-full p-2.5 bg-white border border-slate-300 rounded-xl text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Dirección</label>
          <input type="text" formControlName="Direccion" class="w-full p-2.5 bg-white border border-slate-300 rounded-xl text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Teléfono</label>
          <input type="text" formControlName="Telefono" class="w-full p-2.5 bg-white border border-slate-300 rounded-xl text-sm">
        </div>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
      <div class="border border-slate-200 p-4 rounded-2xl bg-slate-50/50">
        <h3 class="font-bold text-slate-700 mb-3 text-sm uppercase tracking-wider">Tamaño de Pizza</h3>
        <div class="space-y-3">
          <label class="flex items-center justify-between p-2 rounded-xl hover:bg-white transition cursor-pointer">
            <span class="flex items-center gap-2 text-sm font-medium text-slate-700">
              <input type="radio" formControlName="Tamano" value="Chica"> Chica
            </span>
            <span class="text-xs font-bold text-[#D63E12] bg-orange-50 px-2 py-1 rounded-md">$40</span>
          </label>
          <label class="flex items-center justify-between p-2 rounded-xl hover:bg-white transition cursor-pointer">
            <span class="flex items-center gap-2 text-sm font-medium text-slate-700">
              <input type="radio" formControlName="Tamano" value="Mediana"> Mediana
            </span>
            <span class="text-xs font-bold text-[#D63E12] bg-orange-50 px-2 py-1 rounded-md">$80</span>
          </label>
          <label class="flex items-center justify-between p-2 rounded-xl hover:bg-white transition cursor-pointer">
            <span class="flex items-center gap-2 text-sm font-medium text-slate-700">
              <input type="radio" formControlName="Tamano" value="Grande"> Grande
            </span>
            <span class="text-xs font-bold text-[#D63E12] bg-orange-50 px-2 py-1 rounded-md">$120</span>
          </label>
        </div>
      </div>

      <div class="border border-slate-200 p-4 rounded-2xl bg-slate-50/50" formGroupName="Ingredientes">
        <h3 class="font-bold text-slate-700 mb-3 text-sm uppercase tracking-wider">Ingredientes</h3>
        <div class="space-y-3">
          <label class="flex items-center justify-between p-2 rounded-xl hover:bg-white transition cursor-pointer">
            <span class="flex items-center gap-2 text-sm font-medium text-slate-700">
              <input type="checkbox" formControlName="jamon"> Jamón
            </span>
            <span class="text-xs font-bold text-[#D63E12] bg-orange-50 px-2 py-1 rounded-md">+ $10</span>
          </label>
          <label class="flex items-center justify-between p-2 rounded-xl hover:bg-white transition cursor-pointer">
            <span class="flex items-center gap-2 text-sm font-medium text-slate-700">
              <input type="checkbox" formControlName="pina"> Piña
            </span>
            <span class="text-xs font-bold text-[#D63E12] bg-orange-50 px-2 py-1 rounded-md">+ $10</span>
          </label>
          <label class="flex items-center justify-between p-2 rounded-xl hover:bg-white transition cursor-pointer">
            <span class="flex items-center gap-2 text-sm font-medium text-slate-700">
              <input type="checkbox" formControlName="champiniones"> Champiñones
            </span>
            <span class="text-xs font-bold text-[#D63E12] bg-orange-50 px-2 py-1 rounded-md">+ $10</span>
          </label>
          <label class="flex items-center justify-between p-2 rounded-xl hover:bg-white transition cursor-pointer">
            <span class="flex items-center gap-2 text-sm font-medium text-slate-700">
              <input type="checkbox" formControlName="pimientos"> Pimientos
            </span>
            <span class="text-xs font-bold text-[#D63E12] bg-orange-50 px-2 py-1 rounded-md">+ $10</span>
          </label>
        </div>
      </div>
    </div>

    <div class="flex flex-col sm:flex-row items-center justify-between gap-4 mb-6">
      <div class="w-full sm:w-auto">
        <label class="block text-xs font-semibold text-slate-600 mb-1">Número de Pizzas</label>
        <input type="number" formControlName="NumPizzas" min="1" class="w-full sm:w-48 p-2.5 border border-slate-300 rounded-xl text-sm">
      </div>
      <button type="button" (click)="agregarPizza()"
        class="w-full sm:w-auto px-6 py-3 bg-slate-800 hover:bg-slate-900 text-white font-semibold rounded-xl text-sm shadow-md transition cursor-pointer">
        Agregar
      </button>
    </div>

    <div class="overflow-x-auto rounded-xl border border-slate-200 mb-6">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-slate-50 text-slate-700 text-xs uppercase tracking-wider border-b border-slate-200">
            <th class="py-3 px-4 font-bold">Tamaño</th>
            <th class="py-3 px-4 font-bold">Ingredientes</th>
            <th class="py-3 px-4 font-bold text-center">Num Pizzas</th>
            <th class="py-3 px-4 font-bold text-right">Sub Total</th>
            <th class="py-3 px-4 font-bold text-center">Acciones</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-100 text-sm text-slate-700">
          <tr *ngFor="let p of detallePizzas; let i = index" class="hover:bg-slate-50/80 transition">
            <td class="py-3 px-4 font-medium text-slate-900">{{ p.tamano }}</td>
            <td class="py-3 px-4 text-slate-500 text-xs">{{ p.ingredientes }}</td>
            <td class="py-3 px-4 text-center font-semibold">{{ p.numPizzas }}</td>
            <td class="py-3 px-4 text-right font-bold text-[#D63E12]">$ {{ p.subtotal }}</td>
            <td class="py-3 px-4 text-center">
              <button type="button" (click)="quitarPizza(i)" class="text-red-500 hover:text-red-700 font-medium text-xs bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-lg transition cursor-pointer">
                Quitar
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="flex flex-col sm:flex-row items-center justify-between gap-4 pt-4 border-t border-slate-100">
      <div class="text-lg font-bold text-slate-800">
        Total: <span class="text-2xl text-[#D63E12]">${{ calcularTotal }}</span>
      </div>

      <button type="submit"
        class="w-full sm:w-auto px-8 py-3 bg-[#D63E12] hover:bg-[#FF6106] text-white font-semibold rounded-xl text-sm shadow-md hover:shadow-lg transition cursor-pointer">
        Terminar
      </button>
    </div>
  </form>
</div>
